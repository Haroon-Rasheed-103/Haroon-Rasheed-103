<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Animated data pipeline: Sources, Extract, Transform, Load" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="898" height="238" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="450" y="50" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Haroon Rasheed · Data Engineer</text>

  <!-- pipeline line (drawn first so boxes cover it) -->
  <line x1="40" y1="125" x2="860" y2="125" stroke="#30363d" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- flowing data dots -->
  <circle r="6" fill="#3fb950">
    <animateMotion dur="4s" repeatCount="indefinite" path="M40,125 L860,125"/>
  </circle>
  <circle r="6" fill="#149ddd">
    <animateMotion dur="4s" begin="1.33s" repeatCount="indefinite" path="M40,125 L860,125"/>
  </circle>
  <circle r="6" fill="#d29922">
    <animateMotion dur="4s" begin="2.66s" repeatCount="indefinite" path="M40,125 L860,125"/>
  </circle>

  <!-- stage 1 -->
  <rect x="40" y="90" width="160" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#149ddd;#30363d" dur="4s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="120" y="120" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Sources</text>
  <text x="120" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">APIs · Web · CSV</text>

  <!-- stage 2 -->
  <rect x="260" y="90" width="160" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#149ddd;#30363d" dur="4s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="340" y="120" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Extract</text>
  <text x="340" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">Python · Scraping</text>

  <!-- stage 3 -->
  <rect x="480" y="90" width="160" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#149ddd;#30363d" dur="4s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="560" y="120" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Transform</text>
  <text x="560" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">Pandas · Spark</text>

  <!-- stage 4 -->
  <rect x="700" y="90" width="160" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#3fb950;#30363d" dur="4s" begin="3s" repeatCount="indefinite"/>
  </rect>
  <text x="780" y="120" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Load</text>
  <text x="780" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">Postgres · Parquet</text>

  <text x="450" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8b949e">Messy data in, reliable data out.</text>
</svg>
